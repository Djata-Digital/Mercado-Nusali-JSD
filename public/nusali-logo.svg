<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background circle option (transparent) -->
  <g transform="translate(250, 190)">
    <!-- Outer 4-color segmented circle ring -->
    <!-- Top-Left Arc (Blue #0052FF) -->
    <path d="M 0 -140 A 140 140 0 0 0 -140 0" fill="none" stroke="#0052FF" stroke-width="16" stroke-linecap="round" />
    <!-- Top-Right Arc (Red #E51B24) -->
    <path d="M 0 -140 A 140 140 0 0 1 140 0" fill="none" stroke="#E51B24" stroke-width="16" stroke-linecap="round" />
    <!-- Bottom-Right Arc (Yellow #FFB800) -->
    <path d="M 140 0 A 140 140 0 0 1 0 140" fill="none" stroke="#FFB800" stroke-width="16" stroke-linecap="round" />
    <!-- Bottom-Left Arc (Green #10B981) -->
    <path d="M 0 140 A 140 140 0 0 1 -140 0" fill="none" stroke="#10B981" stroke-width="16" stroke-linecap="round" />

    <!-- Central Double-Stroked "N" -->
    <g transform="translate(-70, -75)">
      <!-- Left Stem & Diagonal (Blue #0052FF) -->
      <path d="M 10 0 L 45 0 M 28 0 L 28 150 M 10 150 L 45 150" stroke="#0052FF" stroke-width="8" stroke-linecap="square" fill="none" />
      <path d="M 18 0 L 18 150" stroke="#0052FF" stroke-width="3" fill="none" />

      <!-- Diagonal Stroke -->
      <path d="M 28 0 L 112 150" stroke="#0052FF" stroke-width="12" stroke-linecap="round" fill="none" />
      <path d="M 38 0 L 122 150" stroke="#0052FF" stroke-width="3" fill="none" />

      <!-- Right Stem (Red #E51B24) -->
      <path d="M 95 0 L 130 0 M 112 0 L 112 150 M 95 150 L 130 150" stroke="#E51B24" stroke-width="8" stroke-linecap="square" fill="none" />
      <path d="M 120 0 L 120 150" stroke="#E51B24" stroke-width="3" fill="none" />
    </g>
  </g>

  <!-- Wordmark "Nusali" below -->
  <text x="250" y="420" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-weight="900" font-size="95" letter-spacing="-2">
    <tspan fill="#0052FF">N</tspan>
    <tspan fill="#E51B24">u</tspan>
    <tspan fill="#FFB800">s</tspan>
    <tspan fill="#10B981">a</tspan>
    <tspan fill="#E51B24">l</tspan>
    <tspan fill="#0052FF">i</tspan>
  </text>
</svg>
